<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect: redirect all 404s to index.html
    // preserving the path as a query parameter for client-side routing
    (function() {
      var path = window.location.pathname;
      var base = '/gameboy-collection-tracker/';
      // If we're already at index, don't redirect
      if (path === base || path === base + 'index.html') return;
      // Store the attempted path and redirect to index
      sessionStorage.setItem('redirect', path);
      window.location.replace(base);
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
